<?xml version="1.0" standalone="no"?>
<svg id="logo-with-text" viewBox="0 0 200 200" class="w-48 h-48 mb-8" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><defs><linearGradient id="grad-logo-with-text" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F52BA"/><stop offset="50%" stop-color="#4A90E2"/><stop offset="100%" stop-color="#C0C0C0"/></linearGradient><linearGradient id="streak-logo-with-text" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="white" stop-opacity="0"/><stop offset="50%" stop-color="white" stop-opacity="1"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient><filter id="glow-logo-with-text" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow-logo-with-text" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.25"/></filter><style>
            /* Logo animation classes */
            @keyframes infinite-track {
              from { stroke-dashoffset: 0; }
              to { stroke-dashoffset: -334; }
            }
            
            #logo-with-text .streak {
              stroke-dasharray: 27 307;
              animation: infinite-track 1.8s linear infinite;
              mix-blend-mode: screen;
            }
            
            #logo-with-text .symbol-draw {
              stroke-dasharray: 400;
              stroke-dashoffset: 400;
              animation: draw-symbol 2.5s ease-out forwards;
            }
            
            @keyframes draw-symbol {
              to { stroke-dashoffset: 0; }
            }

            @keyframes draw-in {
              from { opacity: 0; transform: translateY(5px); }
              to { opacity: 1; transform: translateY(0); }
            }
          </style></defs><g filter="url(#shadow-logo-with-text)" transform="translate(0, 20)"><g><path class="symbol-draw" d="M50,60 C50,30 80,30 100,60 C120,90 150,90 150,60 C150,30 120,30 100,60 C80,90 50,90 50,60 Z" fill="none" stroke="url(#grad-logo-with-text)" stroke-width="11" stroke-linecap="round" style="animation: auto ease 0s 1 normal none running none; stroke-dashoffset: 0;"/><path class="streak" d="M50,60 C50,30 80,30 100,60 C120,90 150,90 150,60 C150,30 120,30 100,60 C80,90 50,90 50,60 Z" fill="none" stroke="url(#streak-logo-with-text)" stroke-width="4" stroke-linecap="round" filter="url(#glow-logo-with-text)"/></g><text x="100" y="116" text-anchor="middle" dx="0.4em" style="font-size: 11px; font-weight: bold; font-family: Inter, system-ui, sans-serif; letter-spacing: 0.8em; fill: rgb(51, 65, 85); text-transform: uppercase; animation: 2s ease-out 0s 1 normal forwards running draw-in;">INFINITY</text></g></svg>